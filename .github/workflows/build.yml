name: Gerar instalador do Ditai

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Gerar o executável
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name Ditai --icon ditai.ico
          --add-data "ditai.ico;."
          --hidden-import pystray._win32
          ditai.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar o instalador
        shell: pwsh
        run: |
          $v = "0.0.1"
          if ("${{ github.event_name }}" -eq "release") { $v = "${{ github.event.release.tag_name }}".TrimStart("v") }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" ditai.iss

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Ditai-Setup
          path: Output/Ditai-Setup.exe

      - name: Anexar instalador na Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Output/Ditai-Setup.exe
